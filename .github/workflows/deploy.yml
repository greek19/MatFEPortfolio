name: Deploy portfolio demo to GitHub Pages

on:
  push:
    branches: [main, demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build demo shell
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          mv dist demo-dist
      - name: Build configured portfolio versions
        shell: bash
        run: |
          set -euo pipefail
          VERSIONS=$(node -e "const fs=require('fs'); const items=JSON.parse(fs.readFileSync('public/demo-versions.json','utf8')); process.stdout.write(items.map(item => item.branch).join(' '))")
          for BRANCH in $VERSIONS; do
            VERSION_DIR=".demo-worktrees/$BRANCH"
            git worktree add --detach "$VERSION_DIR" "origin/$BRANCH"
            pnpm --dir "$VERSION_DIR" install --frozen-lockfile
            pnpm --dir "$VERSION_DIR" exec tsc -b
            pnpm --dir "$VERSION_DIR" exec vite build --base="/MatFEPortfolio/$BRANCH/"
            mkdir -p "demo-dist/$BRANCH"
            cp -R "$VERSION_DIR/dist/." "demo-dist/$BRANCH/"
            git worktree remove "$VERSION_DIR" --force
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./demo-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
