<!doctype html>
<html lang="en">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap');
    :root{color-scheme:light;--paper:#edeae3;--ink:#22221e;--line:#22221e30;--accent:#aa452e;font-family:Manrope,Arial,sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;padding:0 clamp(20px,4vw,72px);min-width:280px}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:90px;border-bottom:1px solid var(--line)}.identity{font:400 27px/1 Newsreader,Georgia,serif;letter-spacing:-.04em}.identity small{display:block;font:8px 'DM Mono',monospace;letter-spacing:.08em;margin-top:9px}.eyebrow,.number,.status,footer{font:10px/1.6 'DM Mono',monospace;letter-spacing:.04em}.eyebrow{color:var(--accent)}
    .intro{padding:clamp(38px,6vw,90px) 0 36px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}h1{font:400 clamp(56px,9vw,118px)/.95 Newsreader,Georgia,serif;letter-spacing:-.05em;margin:0}.intro p{font-size:12px;line-height:1.7;max-width:280px;margin:0;opacity:.7}
    .projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px;padding-bottom:64px}.placeholder{aspect-ratio:16/9;display:grid;place-content:center;gap:12px;text-align:center;background:color-mix(in srgb,var(--ink) 4%,var(--paper));border:1px solid var(--line);padding:24px}.placeholder svg{width:36px;height:36px;margin:auto;stroke:currentColor;fill:none;stroke-width:1;opacity:.35}.placeholder p{font:10px 'DM Mono',monospace;margin:0;opacity:.55}.details{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}h2{font:400 clamp(25px,3vw,38px)/1.1 Newsreader,Georgia,serif;letter-spacing:-.025em;margin:5px 0 0}.number{opacity:.6}.status{align-self:flex-end;opacity:.6;font-size:9px}footer{border-top:1px solid var(--line);padding:20px 0;opacity:.65;display:flex;justify-content:space-between;gap:20px;font-size:8px}
    @media(max-width:640px){header{min-height:80px}.eyebrow{font-size:8px}.intro{display:block}.intro p{margin-top:22px}.projects{grid-template-columns:1fr;gap:28px}.status{font-size:8px}footer{flex-wrap:wrap}}
  </style>
</head>
<body>

  <main>
    <div class="intro"><h1>Eventi.</h1><p>Uno spazio dedicato ai video degli eventi.<br>I contenuti saranno disponibili qui.</p></div>
    <div class="projects">

        <div class="details"><div><span class="number">01 / EVENTO</span><h2 id="title-01">Titolo evento</h2></div><span class="status">SEGNAPOSTO</span></div>

        <div class="details"><div><span class="number">02 / EVENTO</span><h2 id="title-02">Titolo evento</h2></div><span class="status">SEGNAPOSTO</span></div>
      </article>
    </div>
  </main>
  <footer><span>MATTEO CATALDO</span><span>EDITOR &amp; COLORIST</span></footer>
</body>
</html>
